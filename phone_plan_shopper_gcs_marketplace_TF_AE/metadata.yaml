apiVersion: blueprint.gcloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: marketplace-tools
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Agent Deployer Terraform Module
    version: test
    actuationTool:
      flavor: Terraform
      version: ">= 1.2"
    description: {}
    softwareGroups:
      - type: SG_OS
        software:
          - title: test
            version: "test"
  content: {}
  interfaces:
    variables:
      - name: project_id
        description: The GCP Project ID (Deployment Project)
        varType: string
        required: true
      - name: goog_cm_deployment_name
        description: The name of the deployment and Agent Engine instance.
        varType: string
        required: true
      - name: source_image
        description: The image name for the disk for the VM instance.
        varType: string
        defaultValue: projects/cpe-isv-partner-experiments/global/images/gsi-agent-test-image
      - name: agent_engine_name
        description: The name of the Agent Engine application
        varType: string
        defaultValue: my-agent
      - name: region
        description: The GCP Region where the agent will be deployed
        varType: string
        defaultValue: us-central1
    outputs:
      - name: agent_engine_id
        description: The ID of the created Agent Engine.
      - name: agent_name
        description: The name of the deployed agent.
