apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: marketplace-tools-display
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  ui:
    input:
      variables:
        project_id:
          name: project_id
          title: Project ID
          invisible: true
        goog_cm_deployment_name:
          name: goog_cm_deployment_name
          title: Goog Cm Deployment Name
          invisible: true
        source_image:
          name: source_image
          title: Image version
          invisible: true
          enumValueLabels:
            - label: gsi-agent-test-image
              value: projects/cpe-isv-partner-experiments/global/images/gsi-agent-test-image
        agent_engine_name:
          name: agent_engine_name
          title: Agent Name
          tooltip: The name of your agent application in Vertex AI Agent Engine.
        region:
          name: region
          title: Region
          tooltip: The Google Cloud region to deploy to.
          xGoogleProperty:
            type: ET_GCE_REGION
        db_conn_secret:
          name: db_conn_secret
          title: DB Connection Secret Name
          tooltip: Name of the Secret Manager secret containing the Cloud SQL instance connection name (e.g. phone_plan_db_connection_name).
        db_user_secret:
          name: db_user_secret
          title: DB User Secret Name
          tooltip: Name of the Secret Manager secret containing the Database Username.
        db_pass_secret:
          name: db_pass_secret
          title: DB Password Secret Name
          tooltip: Name of the Secret Manager secret containing the Database Password.
        db_name_secret:
          name: db_name_secret
          title: DB Name Secret Name
          tooltip: Name of the Secret Manager secret containing the Database schema name.
