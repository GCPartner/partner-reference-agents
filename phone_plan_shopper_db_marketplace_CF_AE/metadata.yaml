apiVersion: blueprints.cloud.google.com/v1alpha1
kind: BlueprintMetadata
metadata:
  name: marketplace-tools
  annotations:
    config.kubernetes.io/local-config: "true"
spec:
  info:
    title: Agent Deployer Terraform Module
    version: test
    actuationTool:
      flavor: Terraform
      version: ">= 1.2"
    description: {}
    softwareGroups:
      - type: SG_OS
        software:
          - title: test
            version: "test"
  content: {}
  interfaces:
    variables:
      - name: project_id
        description: The ID of the project in which to provision resources.
        varType: string
        required: true
      - name: goog_cm_deployment_name
        description: The name of the deployment.
        varType: string
        required: true
      - name: source_image
        description: The source image for the compute instance.
        varType: string
        required: true
      - name: agent_engine_name
        description: The name of the Agent Engine application.
        varType: string
        defaultValue: my-agent
      - name: region
        description: The GCP region to deploy to.
        varType: string
        defaultValue: us-central1
      - name: agent_package_name
        description: The name of the Python package.
        varType: string
        defaultValue: phone_plan_shopper_db
      - name: db_conn_secret
        description: Secret Manager secret ID containing the Cloud SQL instance connection name.
        varType: string
        required: true
      - name: db_user_secret
        description: Secret Manager secret ID containing the Cloud SQL database user.
        varType: string
        required: true
      - name: db_pass_secret
        description: Secret Manager secret ID containing the Cloud SQL database password.
        varType: string
        required: true
      - name: db_name_secret
        description: Secret Manager secret ID containing the Cloud SQL database name.
        varType: string
        required: true
    outputs:
      - name: agent_engine_id
        description: The ID of the Agent Engine application.
      - name: agent_name
        description: The name of the deployed agent.
